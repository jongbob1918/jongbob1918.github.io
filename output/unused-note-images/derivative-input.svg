<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180"><title>입력 x₁과 은닉층 가중치 w₁이 z₁ 계산에 기여하는 구간</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><rect width="640" height="180" fill="white"/><circle cx="68" cy="108" r="43" stroke="#000" stroke-width="2.5" fill="#FFF"/><text x="68" y="117" fill="#000" font-family="Times New Roman, serif" font-size="28" text-anchor="middle">x<tspan baseline-shift="sub" font-size="19">1</tspan></text><path d="M111 108 L380 108" fill="none" stroke="#F58220" stroke-width="2" marker-end="url(#arrow)"/><text x="230" y="78" fill="#238443" font-family="Times New Roman, serif" font-size="28" text-anchor="middle">w<tspan baseline-shift="sub" font-size="19">1</tspan></text><path d="M275 158 L380 114" fill="none" stroke="#AAA" stroke-width="2" marker-end="url(#arrow)"/><circle cx="390" cy="108" r="6" fill="#238443"/><text x="387" y="72" fill="#238443" font-family="Times New Roman, serif" font-size="28" text-anchor="middle">+b<tspan baseline-shift="sub" font-size="19">1</tspan></text><path d="M396 108 L525 108" fill="none" stroke="#F58220" stroke-width="2" marker-end="url(#arrow)"/><text x="485" y="78" fill="#238443" font-family="Times New Roman, serif" font-size="28" text-anchor="middle">z<tspan baseline-shift="sub" font-size="19">1</tspan></text></svg>