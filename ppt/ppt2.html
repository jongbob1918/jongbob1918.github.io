<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Jong-myung | Robot Software Engineer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- Global Variables & Reset --- */
        :root {
            --bg-color: #F8F9FA;
            --surface-color: #FFFFFF;
            --primary-color: #4285F4;
            --text-primary: #202124;
            --text-secondary: #5F6368;
            --border-color: #DADCE0;
            --shadow-sm: 0 1px 2px rgba(60,64,67,0.3);
            --shadow-md: 0 4px 6px rgba(60,64,67,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background: var(--bg-color); color: var(--text-primary); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* --- Structure --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; } /* PPT 느낌을 위해 폭을 넓힘 */
        section { padding: 80px 0; }
        
        /* --- Header --- */
        header { position: fixed; top: 0; width: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); z-index: 100; padding: 15px 0; box-shadow: var(--shadow-sm); }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 1.2rem; }
        .nav-links a { margin-left: 20px; color: var(--text-secondary); font-weight: 500; }
        .nav-links a:hover { color: var(--primary-color); }

        /* --- Hero --- */
        #hero { height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; background: #fff; }
        .hero-title { font-size: 3rem; font-weight: 800; margin-bottom: 10px; }
        .hero-desc { font-size: 1.2rem; color: var(--text-secondary); }

        /* --- Projects Grid (Thumbnail View) --- */
        .project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; margin-top: 40px; }
        .project-card { 
            background: var(--surface-color); border-radius: 12px; overflow: hidden; 
            box-shadow: var(--shadow-sm); transition: 0.3s; cursor: pointer; border: 1px solid var(--border-color);
            display: flex; flex-direction: column;
        }
        .project-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
        .card-thumb { height: 200px; background: #eee; overflow: hidden; }
        .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 20px; flex-grow: 1; }
        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 5px; }
        .card-summary { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 15px; }
        .card-tags span { background: #E8F0FE; color: #1967D2; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; margin-right: 5px; }

        /* --- Modal (PPT Slide Style) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2000;
            display: none; justify-content: center; align-items: center;
            padding: 40px;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-content {
            background: var(--surface-color);
            width: 100%; max-width: 1400px; /* 와이드 슬라이드 느낌 */
            height: 90vh; /* 화면 꽉 차게 */
            border-radius: 16px;
            overflow: hidden; /* 스크롤은 내부에서 */
            display: flex;
            flex-direction: row; /* 좌우 레이아웃 */
            position: relative;
        }

        .close-modal {
            position: absolute; top: 15px; right: 20px; font-size: 2rem; 
            cursor: pointer; color: var(--text-primary); z-index: 10;
        }

        /* --- Left Sidebar (25%) --- */
        .ppt-sidebar {
            width: 25%;
            background: #F8F9FA;
            border-right: 1px solid var(--border-color);
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar-img { 
            width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; 
            margin-bottom: 20px; border: 1px solid #ddd;
        }
        .sidebar-title { font-size: 1.8rem; font-weight: 800; line-height: 1.2; margin-bottom: 10px; color: var(--primary-color); }
        .sidebar-summary { font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 25px; font-weight: 500; border-bottom: 2px solid #ddd; padding-bottom: 15px;}
        
        .meta-group { margin-bottom: 20px; }
        .meta-label { font-size: 0.8rem; color: #888; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
        .meta-value { font-size: 0.95rem; color: var(--text-primary); font-weight: 500; }
        
        .tech-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
        .tech-tag { background: #fff; border: 1px solid #ccc; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
        
        .btn-link {
            margin-top: auto; padding: 10px; text-align: center;
            background: var(--text-primary); color: #fff; border-radius: 6px; font-weight: 600;
        }

        /* --- Right Content (75%) --- */
        .ppt-main {
            width: 75%;
            padding: 40px 50px;
            overflow-y: auto;
        }
        
        .ppt-section { margin-bottom: 50px; }
        .ppt-header { 
            font-size: 1.4rem; font-weight: 700; color: var(--text-primary); 
            margin-bottom: 20px; display: flex; align-items: center; 
        }
        .ppt-header::before {
            content: ''; display: inline-block; width: 6px; height: 24px; 
            background: var(--primary-color); margin-right: 10px; border-radius: 2px;
        }

        .intent-box {
            background: #F1F3F4; padding: 20px; border-radius: 8px; margin-bottom: 20px;
            font-size: 1rem; color: #333;
        }

        /* Troubleshooting Cards */
        .ts-item {
            background: #fff; border: 1px solid #eee; border-radius: 12px;
            padding: 25px; margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .ts-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; color: #D93025; display: flex; align-items: center; gap: 8px; }
        
        .ts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
        .ts-text p { margin-bottom: 8px; font-size: 0.95rem; }
        .ts-label { font-weight: 700; color: var(--text-secondary); font-size: 0.9rem; }
        
        .ts-img-box {
            background: #eee; border-radius: 8px; overflow: hidden;
            height: 200px; border: 1px solid #ddd;
            display: flex; align-items: center; justify-content: center;
        }
        .ts-img-box img { width: 100%; height: 100%; object-fit: contain; } /* 이미지 전체 보이게 */

        @media (max-width: 900px) {
            .modal-content { flex-direction: column; height: auto; max-height: 90vh; overflow-y: auto; }
            .ppt-sidebar, .ppt-main { width: 100%; padding: 25px; border-right: none; }
            .ts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container nav-content">
            <div class="logo">KIM JONG-MYUNG</div>
            <nav class="nav-links">
                <a href="#hero">Home</a>
                <a href="#projects">Projects</a>
            </nav>
        </div>
    </header>

    <section id="hero">
        <div class="container">
            <h1 class="hero-title">Portfolio</h1>
            <p class="hero-desc">Robot Software Engineer Projects</p>
        </div>
    </section>

    <section id="projects">
        <div class="container">
            <h2 style="font-size: 1.8rem; margin-bottom: 20px;">Featured Projects</h2>
            <div class="project-grid" id="project-list">
                </div>
        </div>
    </section>

    <div class="modal-overlay" id="project-modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            
            <div class="ppt-sidebar" id="modal-sidebar">
                </div>

            <div class="ppt-main" id="modal-main">
                </div>
        </div>
    </div>

    <script>
        // --- Project Data ---
        const projects = [
            {
                id: 1,
                title: "JAVIS",
                summary: "도서관/카페 다목적 모바일 매니퓰레이터",
                role: "Main Controller & Nav2 최적화",
                team: "9명 (Team Project)",
                period: "2024.01 - 2024.03 (약 3개월)",
                stack: ["ROS 2", "Nav2", "Python", "Ubuntu 24.04"],
                image: "./assets/images/project_javis.png", // 메인 이미지
                github: "https://github.com/jongbob1918/JAVIS",
                intent: `
                    <ul>
                        <li><strong>개발 목표:</strong> 하드웨어 개발 지연 상황에서도 소프트웨어 로직을 선행 검증할 수 있는 <strong>인터페이스 기반 아키텍처</strong> 설계.</li>
                        <li><strong>핵심 과제:</strong> 60cm 폭의 좁은 도서관 서가를 충돌 없이 주행하기 위한 <strong>정밀 내비게이션 튜닝</strong>.</li>
                    </ul>
                `,
                troubleshooting: [
                    {
                        title: "Narrow Passage 진입 실패",
                        problem: "로봇 폭(50cm) 대비 좁은 통로(60cm)에서 Costmap Inflation 영역이 겹쳐 경로 생성이 안 됨.",
                        solution: "Global Planner를 Smac Hybrid(기구학 고려)로 교체하고, inflation_radius를 0.4m로 축소하여 통로를 '열린 공간'으로 인식시킴.",
                        image: "./assets/images/ts_javis_1.png" // 트러블슈팅 이미지 1
                    },
                    {
                        title: "좁은 공간 내 회전 갇힘 (Oscillation)",
                        problem: "기존 DWA 컨트롤러는 단일 경로만 계산하여, 복잡한 장애물 사이에서 탈출 경로를 못 찾고 제자리 회전함.",
                        solution: "다수의 경로를 확률적으로 예측하는 <strong>MPPI Controller</strong>를 도입하여 국소 최솟값(Local Minima) 탈출 성능 개선.",
                        image: "./assets/images/ts_javis_2.png" // 트러블슈팅 이미지 2
                    }
                ]
            },
            {
                id: 2,
                title: "ROOMIE",
                summary: "호텔 룸서비스 및 엘리베이터 탑승 로봇",
                role: "Arm Control & GUI & PM",
                team: "4명 (Team Project)",
                period: "2025.07 - 2025.08 (38일)",
                stack: ["ROS 2", "Ikpy", "PyQt", "YOLOv8"],
                image: "./assets/images/project_roomie.png",
                github: "https://github.com/jongbob1918/ROMMIE",
                intent: `
                    <ul>
                        <li><strong>개발 목표:</strong> 별도의 통신 모듈 없이 <strong>영상 인식과 로봇팔 조작</strong>만으로 엘리베이터 버튼을 누르는 물리적 상호작용 구현.</li>
                        <li><strong>UX 강화:</strong> 사용자와 관리자가 실시간으로 로봇 상태를 확인할 수 있는 직관적인 웹/앱 GUI 제공.</li>
                    </ul>
                `,
                troubleshooting: [
                    {
                        title: "버튼 타격 위치 오차 (Missed Target)",
                        problem: "카메라 렌즈 왜곡과 물리적 장착 오차로 인해 인식된 좌표와 실제 로봇팔 도달 위치가 어긋남.",
                        solution: "Hand-Eye Calibration 수행 및 버튼 누르기 전 '정렬(Align)' 액션을 추가하여 엔드이펙터를 버튼 정면으로 1차 정렬 후 진입.",
                        image: "./assets/images/ts_roomie_1.gif"
                    },
                    {
                        title: "로봇팔 동작 시 떨림 (Jitter)",
                        problem: "등속 운동 제어 시 시작/정지 시점의 급격한 가속도로 인해 끝단 떨림 발생.",
                        solution: "Gaussian Function 기반의 <strong>S-Curve 속도 프로파일</strong>을 적용하여 부드러운 가감속 궤적 생성.",
                        image: "./assets/images/ts_roomie_2.png"
                    }
                ]
            },
            {
                id: 3,
                title: "FALCON",
                summary: "공항 활주로 FOD 및 위험물 탐지 시스템",
                role: "AI Model Train & Logic",
                team: "4명 (Team Project)",
                period: "2024.10 - 2024.11",
                stack: ["PyTorch", "YOLOv8", "OpenCV", "ByteTrack"],
                image: "./assets/images/project_falcon.png",
                github: "https://github.com/jongbob1918/FALCON",
                intent: `
                    <ul>
                        <li><strong>개발 목표:</strong> 넓은 활주로에서 작은 이물질(FOD)과 작업자를 정확히 구분하고 추적하는 관제 시스템.</li>
                        <li><strong>핵심 기술:</strong> 2D 카메라 영상 좌표를 실제 지도 좌표(GPS)로 변환하는 정밀 호모그래피 구현.</li>
                    </ul>
                `,
                troubleshooting: [
                    {
                        title: "원거리 소형 객체 인식 실패",
                        problem: "활주로 특성상 객체가 매우 작게 보여 기존 YOLO 모델로는 탐지율이 저조함.",
                        solution: "이미지를 그리드로 분할하여 추론하는 SAHI(Slicing Aided Hyper Inference) 기법 도입 검토 및 데이터셋 증강(Augmentation).",
                        image: "./assets/images/ts_falcon_1.png"
                    }
                ]
            }
        ];

        // --- Render List ---
        const list = document.getElementById('project-list');
        projects.forEach(p => {
            const card = document.createElement('div');
            card.className = 'project-card';
            card.innerHTML = `
                <div class="card-thumb"><img src="${p.image}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/400x300'"></div>
                <div class="card-body">
                    <h3 class="card-title">${p.title}</h3>
                    <p class="card-summary">${p.summary}</p>
                    <div class="card-tags">${p.stack.slice(0,3).map(s=>`<span>${s}</span>`).join('')}</div>
                </div>
            `;
            card.onclick = () => openModal(p.id);
            list.appendChild(card);
        });

        // --- Render Modal ---
        const modal = document.getElementById('project-modal');
        const sidebar = document.getElementById('modal-sidebar');
        const main = document.getElementById('modal-main');

        function openModal(id) {
            const p = projects.find(x => x.id === id);
            if(!p) return;

            // 1. Left Sidebar Render
            sidebar.innerHTML = `
                <img src="${p.image}" class="sidebar-img" onerror="this.src='https://via.placeholder.com/400x300'">
                <div class="sidebar-title">${p.title}</div>
                <div class="sidebar-summary">${p.summary}</div>
                
                <div class="meta-group">
                    <div class="meta-label">Role</div>
                    <div class="meta-value">${p.role}</div>
                </div>
                <div class="meta-group">
                    <div class="meta-label">Team & Period</div>
                    <div class="meta-value">${p.team} <br> <span style="font-size:0.85rem; color:#666;">${p.period}</span></div>
                </div>
                <div class="meta-group">
                    <div class="meta-label">Tech Stack</div>
                    <div class="tech-tags">
                        ${p.stack.map(s => `<span class="tech-tag">${s}</span>`).join('')}
                    </div>
                </div>
                <a href="${p.github}" target="_blank" class="btn-link">
                    <i class="fab fa-github"></i> GitHub Repository
                </a>
            `;

            // 2. Right Main Content Render
            const tsHTML = p.troubleshooting.map(ts => `
                <div class="ts-item">
                    <div class="ts-title"><i class="fas fa-exclamation-circle"></i> ${ts.title}</div>
                    <div class="ts-grid">
                        <div class="ts-text">
                            <span class="ts-label">Problem:</span>
                            <p>${ts.problem}</p>
                            <div style="height:10px;"></div>
                            <span class="ts-label" style="color:#137333;">Solution:</span>
                            <p>${ts.solution}</p>
                        </div>
                        <div class="ts-img-box">
                            <img src="${ts.image}" alt="Troubleshooting Image" onerror="this.src='https://via.placeholder.com/400x300?text=Troubleshooting+Image'">
                        </div>
                    </div>
                </div>
            `).join('');

            main.innerHTML = `
                <div class="ppt-section">
                    <div class="ppt-header">Project Intent & Key Features</div>
                    <div class="intent-box">${p.intent}</div>
                </div>
                
                <div class="ppt-section">
                    <div class="ppt-header">Troubleshooting & Tech Dive</div>
                    ${tsHTML}
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        document.querySelector('.close-modal').onclick = () => {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        };
        modal.onclick = (e) => {
            if(e.target === modal) {
                modal.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        };
    </script>
</body>
</html>
