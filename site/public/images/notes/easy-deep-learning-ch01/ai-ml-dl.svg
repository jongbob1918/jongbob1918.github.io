<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">AI·머신러닝·딥러닝의 포함 관계</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#526581" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="24" fill="#f8fafc"/><g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="40" y="52" font-size="28" fill="#172b4d" font-weight="700">AI · ML · DL</text><rect x="40" y="80" width="880" height="435" rx="18" fill="#eaf0fa" stroke="#cbd5e1" stroke-width="2"/><text x="68" y="119" font-size="27" fill="#172b4d" font-weight="700">AI  인공지능</text><text x="68" y="157" font-size="22" fill="#172b4d" font-weight="400">인식·추론·계획 등 지능이 필요한 작업</text><text x="68" y="206" font-size="21" fill="#172b4d" font-weight="400">규칙 기반 시스템</text><text x="68" y="238" font-size="18" fill="#172b4d" font-weight="400">사람이 판단 규칙 작성</text><rect x="335" y="181" width="555" height="306" rx="18" fill="#daeae8" stroke="#cbd5e1" stroke-width="2"/><text x="360" y="224" font-size="27" fill="#172b4d" font-weight="700">ML  머신러닝</text><text x="360" y="262" font-size="22" fill="#172b4d" font-weight="400">데이터와 경험에서 패턴 학습</text><rect x="420" y="298" width="440" height="162" rx="18" fill="#fff4d7" stroke="#ddc887" stroke-width="2"/><text x="447" y="343" font-size="27" fill="#172b4d" font-weight="700">DL  딥러닝</text><text x="447" y="384" font-size="22" fill="#172b4d" font-weight="400">여러 층의 신경망 사용</text><text x="447" y="422" font-size="20" fill="#172b4d" font-weight="400">작업에 필요한 표현을 학습</text></g></svg>