<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">대조학습의 입력 변형과 표현 학습</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#526581" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="24" fill="#f8fafc"/><g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="36" y="49" font-size="27" fill="#172b4d" font-weight="700">대조학습: 변형이 달라도 공통된 표현 찾기</text><rect x="36" y="88" width="255" height="95" rx="18" fill="#eaf0fa" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="124" font-size="22" fill="#172b4d" font-weight="700">원본 A → 변형 A₁</text><text x="57" y="159" font-size="17" fill="#172b4d" font-weight="400">서로 다른 크롭·색상 변형</text><rect x="36" y="211" width="255" height="78" rx="18" fill="#eaf0fa" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="257" font-size="22" fill="#172b4d" font-weight="700">원본 A → 변형 A₂</text><rect x="36" y="334" width="255" height="78" rx="18" fill="#fff4d7" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="380" font-size="20" fill="#172b4d" font-weight="700">다른 원본 B → 변형 B₁</text><rect x="361" y="140" width="193" height="230" rx="18" fill="#daeae8" stroke="#cbd5e1" stroke-width="2"/><text x="391" y="217" font-size="23" fill="#172b4d" font-weight="700">같은 인코더</text><text x="391" y="258" font-size="20" fill="#172b4d" font-weight="400">이미지 → 벡터</text><text x="391" y="301" font-size="19" fill="#172b4d" font-weight="400">가중치 공유</text><path d="M291 133 L325 133 L325 183 L361 183" fill="none" stroke="#526581" stroke-width="3" marker-end="url(#arrow)"/><path d="M291 250 L361 250" fill="none" stroke="#526581" stroke-width="3" marker-end="url(#arrow)"/><path d="M291 373 L325 373 L325 328 L361 328" fill="none" stroke="#526581" stroke-width="3" marker-end="url(#arrow)"/><path d="M554 250 L603 250" fill="none" stroke="#526581" stroke-width="3" marker-end="url(#arrow)"/><rect x="619" y="88" width="307" height="354" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="642" y="127" font-size="22" fill="#172b4d" font-weight="700">표현 공간 (개념도)</text><circle cx="674" cy="201" r="12" fill="#2563eb"/><circle cx="738" cy="220" r="12" fill="#2563eb"/><circle cx="855" cy="363" r="12" fill="#bd760b"/><text x="651" y="181" font-size="19" fill="#172b4d" font-weight="400">A₁</text><text x="729" y="198" font-size="19" fill="#172b4d" font-weight="400">A₂</text><text x="867" y="368" font-size="19" fill="#172b4d" font-weight="400">B₁</text><text x="640" y="262" font-size="20" fill="#172b4d" font-weight="400">A₁ ↔ A₂ 가깝게</text><text x="661" y="315" font-size="19" fill="#172b4d" font-weight="400">A와 B는 멀어지게</text><text x="36" y="505" font-size="23" fill="#172b4d" font-weight="400">손실 계산 → 가중치 조정 → 두 변형에 공통으로 남는 정보 학습</text></g></svg>