<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">강화학습의 에이전트와 환경 상호작용</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#526581" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="24" fill="#f8fafc"/><g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="38" y="52" font-size="28" fill="#172b4d" font-weight="700">강화학습: 행동의 결과로부터 배우기</text><rect x="70" y="180" width="305" height="170" rx="18" fill="#eaf0fa" stroke="#cbd5e1" stroke-width="2"/><text x="104" y="227" font-size="27" fill="#172b4d" font-weight="700">에이전트 · Agent</text><text x="104" y="272" font-size="23" fill="#172b4d" font-weight="400">정책으로 행동 선택</text><text x="104" y="314" font-size="18" fill="#172b4d" font-weight="400">예: 로봇 제어 명령 결정</text><rect x="585" y="180" width="305" height="170" rx="18" fill="#daeae8" stroke="#cbd5e1" stroke-width="2"/><text x="620" y="227" font-size="25" fill="#172b4d" font-weight="700">환경 · Environment</text><text x="620" y="272" font-size="22" fill="#172b4d" font-weight="400">행동에 따라 상태 변화</text><text x="620" y="314" font-size="18" fill="#172b4d" font-weight="400">예: 로봇 이동·장애물 접촉</text><path d="M222 180 L222 111 L737 111 L737 180" fill="none" stroke="#526581" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="96" font-size="22" fill="#172b4d" font-weight="700">행동 · Action</text><path d="M737 350 L737 419 L222 419 L222 350" fill="none" stroke="#526581" stroke-width="3" marker-end="url(#arrow)"/><text x="329" y="459" font-size="23" fill="#172b4d" font-weight="700">다음 관측 + 보상</text><text x="196" y="516" font-size="21" fill="#172b4d" font-weight="400">목표: 한 번의 보상이 아닌 누적 보상을 크게 만드는 정책</text></g></svg>