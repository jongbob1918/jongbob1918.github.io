<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
<title id="title">맛집까지 한 칸씩 이동하기</title>
<desc id="desc">4행 4열 지도. 나는 왼쪽 위에서 출발하고 맛집은 오른쪽 아래에 있다. 가운데 두 칸은 건물이다. 예시 경로는 오른쪽으로 세 번, 아래로 세 번 이동한다.</desc>
