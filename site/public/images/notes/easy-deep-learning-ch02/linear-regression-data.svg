<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">조회수와 실제 수익으로 구성한 학습 데이터</title>
  <desc id="desc">가로축은 조회수, 세로축은 실제 수익이다. 영상 A는 1만 회와 2만 원, 영상 B는 2만 회와 4만 원인 점으로 표시한다.</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK KR", "Noto Sans KR", sans-serif; fill: #253047; }
      .axis { stroke: #4b5568; stroke-width: 2; }
      .grid { stroke: #dfe4ec; stroke-width: 1; stroke-dasharray: 5 6; }
      .guide { stroke: #8ca4cc; stroke-width: 1.5; stroke-dasharray: 4 5; }
      .tick { font-size: 16px; fill: #697386; }
      .axis-label { font-size: 19px; font-weight: 600; }
      .point-label { font-size: 18px; font-weight: 700; fill: #285ea8; }
      .note { font-size: 16px; fill: #526078; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#4b5568"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="718" height="428" rx="10" fill="#fff" stroke="#dfe4ec" stroke-width="2"/>
  <text class="note" x="360" y="35" text-anchor="middle">점 하나가 기존 영상 하나의 학습 데이터입니다</text>

  <path class="grid" d="M120 310H620M120 250H620M120 190H620M120 130H620M120 70H620"/>
  <path class="grid" d="M280 70V370M440 70V370M600 70V370"/>
  <path class="axis" d="M120 370H640" marker-end="url(#arrow)"/>
  <path class="axis" d="M120 370V50" marker-end="url(#arrow)"/>

  <text class="tick" x="120" y="397" text-anchor="middle">0</text>
  <text class="tick" x="280" y="397" text-anchor="middle">1</text>
  <text class="tick" x="440" y="397" text-anchor="middle">2</text>
  <text class="tick" x="600" y="397" text-anchor="middle">3</text>
  <text class="tick" x="98" y="315" text-anchor="end">1</text>
  <text class="tick" x="98" y="255" text-anchor="end">2</text>
  <text class="tick" x="98" y="195" text-anchor="end">3</text>
  <text class="tick" x="98" y="135" text-anchor="end">4</text>
  <text class="tick" x="98" y="75" text-anchor="end">5</text>

  <text class="axis-label" x="626" y="421" text-anchor="end">조회수 x (만 회)</text>
  <text class="axis-label" x="27" y="205" text-anchor="middle" transform="rotate(-90 27 205)">실제 수익 y (만 원)</text>

  <path class="guide" d="M280 370V250M120 250H280"/>
  <circle cx="280" cy="250" r="9" fill="#3978cf" stroke="#fff" stroke-width="3"/>
  <text class="point-label" x="298" y="236">A (1, 2)</text>

  <path class="guide" d="M440 370V130M120 130H440"/>
  <circle cx="440" cy="130" r="9" fill="#3978cf" stroke="#fff" stroke-width="3"/>
  <text class="point-label" x="458" y="116">B (2, 4)</text>
</svg>
