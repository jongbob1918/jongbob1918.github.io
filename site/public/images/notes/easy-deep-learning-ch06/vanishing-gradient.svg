<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">신경망의 역전파에서 작아지는 기울기</title>
  <desc id="desc">각 층에 노드가 세 개씩 연결된 신경망. 파란 화살표는 한 경로의 역전파를 나타낸다. 이 경로의 가중치가 1이고 활성화 함수 미분값이 0.25일 때, 경로를 따라 곱해지는 값이 1에서 0.015625까지 줄어든다. 여러 경로를 합산한 전체 기울기는 아니다. 화살표 두께는 감소를 개략적으로 나타낸다.</desc>
  <rect width="720" height="300" rx="16" fill="#f8fafc"/>
