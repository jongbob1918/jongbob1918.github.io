<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">오차의 합은 같지만 예측은 다른 두 직선</title>
  <desc id="desc">A는 조회수 1만 회와 수익 2만 원, B는 조회수 2만 회와 수익 4만 원이다. 빨간 직선 y=2x는 두 점을 모두 맞힌다. 초록 직선 y=x+1.5는 A를 0.5만 원 높게, B를 0.5만 원 낮게 예측한다. 두 직선 모두 부호 있는 오차의 합은 0이다.</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK KR", "Noto Sans KR", sans-serif; fill: #242424; }
      .axis { stroke: #242424; stroke-width: 2; }
      .grid { stroke: #dedede; stroke-width: 1; }
      .exact-line { stroke: #e6a0a0; stroke-width: 3; fill: none; }
      .offset-line { stroke: #70a984; stroke-width: 3; fill: none; }
      .error-segment { stroke: #4c4c4c; stroke-width: 2; fill: none; }
      .red-caption { font-size: 18px; font-weight: 700; fill: #a45c5c; }
      .green-caption { font-size: 18px; font-weight: 700; fill: #397a51; }
      .error-label { font-size: 16px; font-weight: 700; fill: #5a463b; paint-order: stroke fill; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
      .tick { font-size: 16px; fill: #444444; }
      .axis-label { font-size: 19px; font-weight: 600; }
      .point-label { font-size: 18px; font-weight: 700; fill: #2b4e6c; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#242424"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="430" fill="#fff"/>
  <text class="red-caption" x="160" y="32">빨간 직선 y = 2x</text>
  <text class="green-caption" x="430" y="32">초록 직선 y = x + 1.5</text>
  <path class="grid" d="M160 310H640M160 250H640M160 190H640M160 130H640M160 70H640"/>
  <path class="grid" d="M360 70V370M560 70V370"/>
  <path class="exact-line" d="M160 370L620 94"/>
  <path class="offset-line" d="M160 280L620 142"/>
  <path class="error-segment" d="M360 220V250M560 160V130"/>
  <path class="axis" d="M160 370H650" marker-end="url(#arrow)"/>
  <path class="axis" d="M160 370V55" marker-end="url(#arrow)"/>
  <text class="tick" x="160" y="397" text-anchor="middle">0</text>
  <text class="tick" x="360" y="397" text-anchor="middle">1</text>
  <text class="tick" x="560" y="397" text-anchor="middle">2</text>
  <text class="tick" x="138" y="315" text-anchor="end">1</text>
  <text class="tick" x="138" y="255" text-anchor="end">2</text>
  <text class="tick" x="138" y="195" text-anchor="end">3</text>
  <text class="tick" x="138" y="135" text-anchor="end">4</text>
  <text class="tick" x="138" y="75" text-anchor="end">5</text>
  <text class="axis-label" x="643" y="421" text-anchor="end">조회수 x (만 회)</text>
  <text class="axis-label" x="35" y="205" text-anchor="middle" transform="rotate(-90 35 205)">실제 수익 y (만 원)</text>
  <circle cx="360" cy="250" r="6" fill="#315a7a"/>
  <text class="point-label" x="333" y="274">A</text>
  <circle cx="560" cy="130" r="6" fill="#315a7a"/>
  <text class="point-label" x="535" y="113">B</text>
  <text class="error-label" x="374" y="241">+0.5</text>
  <text class="error-label" x="574" y="153">−0.5</text>
</svg>
